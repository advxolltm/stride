root = "."
tmp_dir = "tmp"

[build]
  cmd = "swag init -g server.go -d ./cmd,./routes && go build -o ./tmp/server ./cmd/server.go"
  entrypoint = "./tmp/server"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "vendor", "docs"]
  exclude_regex = ["_test.go"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "1s"
  poll = true
  poll_interval = 500

[log]
  time = true
